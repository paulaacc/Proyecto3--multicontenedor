# Proyecto 03 - Aplicación multicontenedor "Votación Docker Compose vs Kubernetes"
# Infraestructura y Seguridad Computacional - Universidad de Ibagué

services:
  # ---------- WEB (Python) ----------
  vote:
    build: ./vote
    image: ${DOCKERHUB_USER}/proyecto03-vote:1.0
    ports:
      - "5000:80"            # http://localhost:5000
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net

  # ---------- VISUALIZAR RESULTADOS (Node.js) ----------
  result:
    build: ./result
    image: ${DOCKERHUB_USER}/proyecto03-result:1.0
    ports:
      - "5001:80"            # http://localhost:5001
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net

  # ---------- PROCESAMIENTO DE RESULTADOS (Python worker) ----------
  worker:
    build: ./worker
    image: ${DOCKERHUB_USER}/proyecto03-worker:1.0
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MONGO_URL: mongodb://mongo:27017
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - backend-net

  # ---------- BASES DE DATOS ----------
  redis:                      # cola de votos
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend-net

  db:                         # votos definitivos
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - backend-net

  mongo:                      # auditoría de eventos
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend-net

volumes:
  redis-data:
  postgres-data:
  mongo-data:

networks:
  frontend-net:               # usuarios <-> vote / result
    driver: bridge
  backend-net:                # servicios <-> bases de datos
    driver: bridge
